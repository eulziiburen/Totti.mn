<title>52 Спонсорын багц</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" id="font-link" href="https://fonts.googleapis.com/css2?family=Tektur:wght@400;700;900&family=Manrope:wght@400;600;800&display=swap">
<style id="book-style">
:root{
  --stage:#0b0b0e; --stage-2:#1a1410; --bar:#08080a; --bar-ink:#f1ede6; --bar-dim:#8f8a82;
  --arena:#0d0d10; --arena-2:#1b1b21; --paper:#f4f0e8; --ink:#111114; --ink-2:#5d5b61; --line:#dcd5c8;
  --orange:#ff5a1f; --orange-2:#ff8a3d; --gold:#e3b53c; --silver:#b8bdc6; --bronze:#c47a44; --red:#e0412b;
  --ph:#e7e1d6; --ph-2:#d8d0c2;
  --display:"Tektur","Arial Black",Impact,sans-serif;
  --body:"Manrope","Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--bar-ink);font-family:"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- app shell ---------- */
.app{min-height:100%;display:flex;flex-direction:column;background:radial-gradient(90% 70% at 50% 0%,#2a1a10 0%,var(--stage) 65%)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:color-mix(in srgb,var(--bar) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid #ffffff14}
.brand{display:flex;align-items:center;gap:10px;min-width:0;margin-right:auto}
.brand b{font-family:var(--display);font-weight:900;font-size:18px;line-height:1;background:var(--orange);color:var(--ink);padding:6px 8px;border-radius:50%;width:38px;height:38px;display:grid;place-items:center}
.brand span{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid #ffffff26;background:transparent;color:var(--bar-ink);padding:7px 12px;border-radius:999px;font-size:13px}
.btn:hover{background:#ffffff12}
.btn.primary{background:var(--orange);border-color:var(--orange);color:var(--ink);font-weight:700}
.btn.primary:hover{filter:brightness(1.06)}
.btn[disabled]{opacity:.45;cursor:default}
.status{font-size:12px;color:var(--bar-dim)}
.status.dirty{color:var(--orange-2)}
.banner{margin:12px 16px 0;padding:10px 14px;border-radius:8px;background:#ff5a1f22;border:1px solid #ff5a1f66;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner p{margin:0;flex:1 1 240px}
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 16px 12px}
#book{margin:0 auto}
.nav{display:flex;align-items:center;gap:12px;padding:8px 16px 18px;max-width:960px;width:100%;margin:0 auto}
.nav .arrow{width:40px;height:40px;border-radius:50%;border:1px solid #ffffff26;background:transparent;color:var(--bar-ink);font-size:18px;flex:none}
.nav .arrow:hover{background:var(--orange);color:var(--ink);border-color:var(--orange)}
.nav input[type=range]{flex:1;accent-color:var(--orange);min-width:0}
.nav .count{font-family:var(--display);font-variant-numeric:tabular-nums;color:var(--orange);font-size:13px;white-space:nowrap;min-width:70px;text-align:center}
.simple{display:flex;gap:0;justify-content:center;width:100%}
.simple .page{width:min(44vw,460px);flex:none;box-shadow:0 10px 40px #000a}
@media (max-width:760px){.simple .page{width:min(100%,460px)}}

/* ---------- editor ---------- */
.editor{padding:20px 16px 60px;display:flex;flex-direction:column;align-items:center;gap:18px}
.help{max-width:960px;width:100%;color:var(--bar-dim);font-size:13px;line-height:1.5;margin:0}
.help b{color:var(--bar-ink)}
.ed-page{display:flex;gap:14px;align-items:flex-start;width:100%;max-width:960px;flex-wrap:wrap;justify-content:center}
.ed-page .page{width:min(100%,460px);box-shadow:0 10px 30px #0008;flex:none}
.ed-tools{display:flex;flex-direction:column;gap:6px;min-width:150px}
.ed-tools .num{font-family:var(--display);font-weight:900;font-size:28px;color:var(--orange);line-height:1}
.ed-tools .kind{color:var(--bar-dim);font-size:12px;margin-bottom:6px}
.add-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%;max-width:960px;padding:6px 0;border-top:1px dashed #ffffff22}
.add-row .lbl{color:var(--bar-dim);font-size:12px;align-self:center}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.danger:hover{background:#e0412b33;border-color:var(--red)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--paper);color:var(--ink);padding:10px 16px;border-radius:8px;box-shadow:0 8px 30px #000a;z-index:50;font-weight:600;max-width:calc(100% - 32px)}
.fontpanel{width:100%;max-width:960px;background:#ffffff0a;border:1px solid #ffffff1f;border-radius:12px;padding:14px 16px}
.fontpanel h3{margin:0 0 10px;font-size:14px;font-weight:700;color:var(--orange);letter-spacing:.04em}
.fp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 18px;align-items:end}
.fp-grid label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--bar-dim)}
.fp-grid label output{color:var(--bar-ink);font-variant-numeric:tabular-nums}
.fp-grid select{font:inherit;font-size:14px;color:var(--bar-ink);background:var(--bar);border:1px solid #ffffff2e;border-radius:6px;padding:7px 8px}
.fp-grid input[type=range]{accent-color:var(--orange)}
.fp-grid .chk{flex-direction:row;align-items:center;gap:8px;color:var(--bar-ink)}
.fp-grid .chk input{accent-color:var(--orange);width:16px;height:16px}

/* ---------- printed page: shared ---------- */
.page{background:var(--paper);color:var(--ink);aspect-ratio:1/1.414;position:relative;overflow:hidden;container-type:size;font-family:var(--body)}
.stf__item.page{aspect-ratio:auto}
.page.dark{background:var(--arena);color:var(--paper)}
.pg{position:absolute;inset:0;padding:7cqw 7cqw 10cqw;display:flex;flex-direction:column;gap:2.8cqw;z-index:2}
.kicker{font-family:var(--body);font-weight:800;font-size:calc(2.3cqw*var(--bs,1));letter-spacing:.2em;text-transform:uppercase;color:var(--orange);display:flex;align-items:center;gap:1.6cqw}
.kicker::before{content:"";width:4cqw;height:.5cqw;background:currentColor;flex:none}
.h1{font-family:var(--display);font-weight:900;font-size:calc(8.4cqw*var(--hs,1));line-height:.98;text-transform:uppercase;letter-spacing:-.02em;margin:0;text-wrap:balance}
.h2{font-family:var(--display);font-weight:900;font-size:calc(6.6cqw*var(--hs,1));line-height:1;text-transform:uppercase;letter-spacing:-.02em;margin:0;text-wrap:balance}
.lead{font-size:calc(3.4cqw*var(--bs,1));line-height:1.42;font-weight:600;margin:0;white-space:pre-line}
.body{font-size:calc(2.9cqw*var(--bs,1));line-height:1.55;margin:0;white-space:pre-line}
.small{font-size:calc(2.4cqw*var(--bs,1));line-height:1.4;color:var(--ink-2);white-space:pre-line}
.dark .small{color:#ffffffa6}
.court{position:absolute;inset:0;width:100%;height:100%;color:var(--ink);opacity:.07;pointer-events:none;z-index:1}
.dark .court{color:#fff;opacity:.09}
.foot{position:absolute;left:7cqw;right:7cqw;bottom:3.6cqw;display:flex;align-items:center;gap:2cqw;font-size:calc(2cqw*var(--bs,1));font-weight:800;color:var(--ink-2);letter-spacing:.14em;text-transform:uppercase;z-index:3}
.foot svg{width:3.6cqw;height:3.6cqw;flex:none}
.foot .rule{flex:1;height:.35cqw;background:currentColor;opacity:.35}
.foot .n{font-family:var(--display);font-weight:900;font-size:calc(4.2cqw*var(--hs,1));letter-spacing:-.02em;color:var(--orange)}
.page.even .foot{flex-direction:row-reverse}
.dark .foot{color:#ffffff99}

/* photos */
.ph{margin:0;position:relative;overflow:hidden;background:repeating-linear-gradient(135deg,var(--ph) 0 2cqw,var(--ph-2) 2cqw 4cqw);display:grid;place-items:center;min-height:0}
.dark .ph{background:repeating-linear-gradient(135deg,#1c1c22 0 2cqw,#24242b 2cqw 4cqw)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none}
.ph .ph-l{font-size:calc(2.3cqw*var(--bs,1));color:var(--ink-2);background:var(--paper);padding:1cqw 2cqw;border-radius:1cqw;text-align:center;max-width:80%;position:relative}
.duo{position:absolute;overflow:hidden}
.duo .ph{position:absolute;inset:0}
.duo img{filter:grayscale(1) contrast(1.2) brightness(.95)}
.duo::after{content:"";position:absolute;inset:0;background:var(--orange);mix-blend-mode:multiply;opacity:.85;pointer-events:none}
.duo::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none}

/* editing affordances */
.editing .ph{cursor:pointer}
.editing .ph::after{content:"Зураг солих";position:absolute;right:1.5cqw;top:1.5cqw;font-size:2.2cqw;background:var(--ink);color:var(--paper);padding:.8cqw 1.6cqw;border-radius:1cqw;opacity:0;transition:opacity .15s;z-index:4}
.editing .ph:hover::after{opacity:1}
.editing [data-f]{outline:1px dashed #ff5a1f66;outline-offset:.6cqw;border-radius:2px;min-width:3cqw}
.editing [data-f]:hover{outline-color:var(--orange)}
.editing [data-f]:focus{outline:2px solid var(--orange);background:#ff5a1f14}
.editing [data-f]:empty::before{content:"…";opacity:.6}
.item-x{display:none}
.editing .item{position:relative}
.editing .item-x{display:grid;place-items:center;position:absolute;top:-1.5cqw;right:-1.5cqw;width:4.4cqw;height:4.4cqw;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:2.8cqw;line-height:1;z-index:5;padding:0}
.item-add{display:none}
.editing .item-add{display:inline-block;align-self:flex-start;border:1px dashed var(--orange);background:transparent;color:var(--orange);font-size:2.4cqw;padding:.8cqw 2cqw;border-radius:99px;position:relative;z-index:3}
.no-upper .h1,.no-upper .h2,.no-upper .cv-title,.no-upper .ch-t,.no-upper .co-name,.no-upper .hd,.no-upper .rg-h{text-transform:none}

/* medal chips */
.md{display:inline-block;font-weight:800;font-size:.86em;line-height:1.25;padding:0 .9cqw;border-radius:99px;color:#111;vertical-align:.05em}
.md.g{background:var(--gold)}.md.s{background:var(--silver)}.md.b{background:var(--bronze);color:#fff}

/* ---------- cover ---------- */
.cover .duo{inset:0}
.cover .duo::before{background:linear-gradient(180deg,#0d0d10f0 0%,#0d0d1066 30%,#0d0d1000 48%,#0d0d10cc 78%,#0d0d10 100%)}
.cover .pg{justify-content:space-between;pointer-events:none}
.cover .pg>*{pointer-events:auto}
.cover .kicker{color:var(--paper)}
.cv-52{position:absolute;right:-5cqw;bottom:24cqw;font-family:var(--display);font-weight:900;font-size:calc(74cqw*var(--hs,1));line-height:.78;letter-spacing:-.06em;color:transparent;-webkit-text-stroke:.45cqw var(--orange);z-index:2;pointer-events:none}
.cv-bottom{display:flex;flex-direction:column;gap:2.4cqw}
.cv-title{font-family:var(--display);font-weight:900;font-size:calc(12cqw*var(--hs,1));line-height:.9;letter-spacing:-.03em;text-transform:uppercase;margin:0;color:var(--paper);white-space:pre-line}
.cv-sub{font-size:calc(3cqw*var(--bs,1));line-height:1.4;margin:0;max-width:78%;color:#ffffffd9;white-space:pre-line}
.badge{position:absolute;top:15cqw;right:7cqw;width:25cqw;height:25cqw;border-radius:50%;background:var(--orange);color:var(--ink);display:grid;place-items:center;text-align:center;transform:rotate(-12deg);z-index:3;padding:3cqw;box-shadow:0 1.5cqw 4cqw #0008}
.badge span{font-family:var(--display);font-weight:900;font-size:calc(2.6cqw*var(--hs,1));line-height:1.15;text-transform:uppercase;white-space:pre-line}

/* ---------- intro / toc ---------- */
.toc{display:flex;flex-direction:column;margin-top:auto;border-top:.5cqw solid var(--ink)}
.toc a{all:unset;display:grid;grid-template-columns:12cqw 1fr auto;align-items:baseline;gap:2cqw;padding:2cqw 0;border-bottom:.25cqw solid var(--line);cursor:pointer}
.toc .q{font-family:var(--display);font-weight:900;font-size:calc(6cqw*var(--hs,1));color:var(--orange);line-height:1}
.toc .t{font-family:var(--display);font-weight:700;font-size:calc(3.1cqw*var(--hs,1));text-transform:uppercase}
.toc .t small{display:block;font-family:var(--body);font-weight:600;font-size:calc(2.2cqw*var(--bs,1));color:var(--ink-2);text-transform:none;margin-top:.6cqw}
.toc .pn{font-family:var(--display);font-weight:700;font-size:calc(3cqw*var(--hs,1));font-variant-numeric:tabular-nums}

/* ---------- scoreboard ---------- */
.sb{background:#050506;background-image:radial-gradient(#1b1b1f 22%,transparent 24%);background-size:1.5cqw 1.5cqw;border:.7cqw solid #26262c;border-radius:2.4cqw;padding:4cqw;display:grid;grid-template-columns:1fr 1fr;gap:5cqw 4cqw;box-shadow:inset 0 0 6cqw #000}
.sb .item{display:flex;flex-direction:column;gap:1.2cqw}
.led{font-family:var(--display);font-weight:900;font-size:calc(15cqw*var(--hs,1));line-height:.9;color:var(--orange);text-shadow:0 0 2.4cqw #ff5a1f99;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.sb .lbl{font-size:calc(2.4cqw*var(--bs,1));font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#ffffffc0;white-space:pre-line;line-height:1.35}
.board .body{color:#ffffffb8;margin-top:auto}
.sb-head{display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-weight:700;font-size:calc(2.6cqw*var(--hs,1));letter-spacing:.14em;color:var(--gold);text-transform:uppercase;border-bottom:.3cqw solid #ffffff1c;padding-bottom:2cqw;grid-column:1/-1}
.sb-head i{width:2cqw;height:2cqw;border-radius:50%;background:var(--red);box-shadow:0 0 2cqw var(--red);display:inline-block}

/* ---------- chapter ---------- */
.chapter .duo{left:0;right:0;bottom:0;height:56%}
.chapter .duo::before{background:linear-gradient(180deg,var(--arena) 0%,#0d0d1000 40%,#0d0d1000 70%,#0d0d10cc 100%)}
.chapter .pg{pointer-events:none}.chapter .pg>*{pointer-events:auto}
.ch-q{display:flex;align-items:flex-end;gap:3cqw;margin-top:2cqw}
.ch-n{font-family:var(--display);font-weight:900;font-size:calc(46cqw*var(--hs,1));line-height:.78;letter-spacing:-.06em;color:var(--orange)}
.ch-l{font-family:var(--display);font-weight:900;font-size:calc(6cqw*var(--hs,1));line-height:1;text-transform:uppercase;padding-bottom:2cqw}
.ch-t{font-family:var(--display);font-weight:900;font-size:calc(8cqw*var(--hs,1));line-height:.95;text-transform:uppercase;letter-spacing:-.02em;margin:0;text-wrap:balance}
.ch-s{font-size:calc(2.8cqw*var(--bs,1));line-height:1.45;margin:0;max-width:70%;color:#ffffffc8;white-space:pre-line}

/* ---------- coach ---------- */
.coach .pg{padding-left:17cqw}
.co-v{position:absolute;left:1.5cqw;top:6cqw;bottom:6cqw;writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--display);font-weight:900;font-size:calc(12cqw*var(--hs,1));line-height:1;text-transform:uppercase;letter-spacing:-.02em;color:transparent;-webkit-text-stroke:.3cqw var(--ink);white-space:nowrap;overflow:hidden;z-index:2;text-align:center}
.co-hero{position:relative;align-self:center;width:min(58cqw,100%);flex:none}
.co-ring{border-radius:50%;overflow:hidden;aspect-ratio:1;border:1.4cqw solid var(--orange);box-shadow:0 0 0 .5cqw var(--ink)}
.co-ring .ph{width:100%;height:100%}
.co-ring img{object-position:50% 35%}
.co-tag{position:absolute;right:-2cqw;bottom:3cqw;background:var(--ink);color:var(--paper);font-family:var(--display);font-weight:900;font-size:calc(2.6cqw*var(--hs,1));padding:1.4cqw 2.4cqw;border-radius:99px;transform:rotate(-6deg);text-transform:uppercase;white-space:nowrap}
.co-first{font-family:var(--display);font-weight:700;font-size:calc(3.2cqw*var(--hs,1));text-transform:uppercase;letter-spacing:.04em;margin-bottom:-2cqw}
.co-name{font-family:var(--display);font-weight:900;font-size:calc(9.4cqw*var(--hs,1));line-height:.95;text-transform:uppercase;letter-spacing:-.03em;color:var(--orange);margin:0}
.co-role{font-size:calc(2.4cqw*var(--bs,1));font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.cq{margin:auto 0 0;background:var(--ink);color:var(--paper);padding:3cqw 3.4cqw;border-radius:0 3cqw 0 3cqw;font-size:calc(2.8cqw*var(--bs,1));font-weight:600;line-height:1.45;white-space:pre-line;position:relative}
.cq::before{content:"“";position:absolute;top:-4cqw;left:2cqw;font-family:var(--display);font-weight:900;font-size:calc(12cqw*var(--hs,1));color:var(--orange);line-height:1}
.cq p{margin:0}

/* ---------- timeline ---------- */
.tl{display:flex;flex-direction:column;gap:2.2cqw;position:relative;padding-left:6cqw}
.tl::before{content:"";position:absolute;left:1.6cqw;top:1cqw;bottom:1cqw;width:.5cqw;background:var(--ink)}
.tl .item{display:grid;grid-template-columns:17cqw 1fr;gap:2.4cqw;align-items:baseline;position:relative}
.tl .item::before{content:"";position:absolute;left:-6cqw;top:.6cqw;width:3.6cqw;height:3.6cqw;border-radius:50%;background:var(--orange);background-image:linear-gradient(90deg,transparent 46%,#111 46% 54%,transparent 54%),linear-gradient(0deg,transparent 46%,#111 46% 54%,transparent 54%);box-shadow:inset 0 0 0 .35cqw #111}
.tl .yr{font-family:var(--display);font-weight:900;font-size:calc(3.8cqw*var(--hs,1));line-height:1.1;letter-spacing:-.02em}
.tl .body{font-size:calc(2.8cqw*var(--bs,1));line-height:1.45}

/* ---------- list (jersey numbers) ---------- */
.list .ph{flex:1 1 38cqw;min-height:16cqw;margin:0 -7cqw}
.jl{display:flex;flex-direction:column;gap:2.4cqw}
.jl .item{display:grid;grid-template-columns:13cqw 1fr;gap:3cqw;align-items:start}
.jn{font-family:var(--display);font-weight:900;font-size:calc(10cqw*var(--hs,1));line-height:.85;color:transparent;-webkit-text-stroke:.3cqw var(--orange);letter-spacing:-.05em}
.jl .hd{font-family:var(--display);font-weight:700;font-size:calc(3.4cqw*var(--hs,1));text-transform:uppercase;margin-bottom:.8cqw}

/* ---------- trophies ---------- */
.tw{display:grid;grid-template-columns:repeat(3,1fr);gap:2.4cqw;flex:1;align-content:start}
.tw .item{border:.3cqw solid #ffffff24;border-radius:2cqw;padding:2.6cqw 2.2cqw;display:flex;flex-direction:column;gap:1.2cqw;background:linear-gradient(180deg,#ffffff0d,#ffffff03)}
.tw svg{width:6cqw;height:6cqw;color:var(--gold)}
.tc-y{font-family:var(--display);font-weight:900;font-size:calc(3.6cqw*var(--hs,1));color:var(--gold);letter-spacing:-.02em}
.tc-t{font-size:calc(2.25cqw*var(--bs,1));line-height:1.4;color:#ffffffd0;white-space:pre-line}

/* ---------- record ---------- */
.rg{display:flex;flex-direction:column;gap:.9cqw}
.rg-h{font-family:var(--display);font-weight:900;font-size:calc(3.1cqw*var(--hs,1));text-transform:uppercase;margin:1.2cqw 0 .6cqw;background:var(--ink);color:var(--orange);padding:1.2cqw 2cqw;letter-spacing:.02em;align-self:flex-start;transform:skewX(-8deg)}
.rl{display:flex;flex-direction:column;gap:1cqw}
.rl .item{display:grid;grid-template-columns:14cqw 1fr;gap:2.4cqw;align-items:baseline;border-bottom:.2cqw solid var(--line);padding-bottom:1cqw}
.rl .yr{font-family:var(--display);font-weight:800;font-size:calc(2.8cqw*var(--hs,1));font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.rl .tx{font-size:calc(2.45cqw*var(--bs,1));line-height:1.45;white-space:pre-line}

/* ---------- spotlight ---------- */
.spotlight .ph.sp-img{position:absolute;left:0;top:0;bottom:0;width:50%;z-index:1}
.spotlight .sp-img img{object-position:50% 20%}
.spotlight .pg{padding-left:55cqw}
.sp-big{font-family:var(--display);font-weight:900;font-size:calc(16cqw*var(--hs,1));line-height:.85;letter-spacing:-.05em;color:var(--orange);margin-top:auto}
.sp-name{font-family:var(--display);font-weight:900;font-size:calc(5cqw*var(--hs,1));line-height:1;text-transform:uppercase}
.spotlight .body{color:#ffffffd0;font-size:calc(2.7cqw*var(--bs,1))}

/* ---------- gallery mosaics ---------- */
.gal{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:1fr;gap:1.6cqw;flex:1;min-height:0;margin:0 -3cqw}
.gal .item{position:relative;min-height:0;grid-column:span 3}
.gal .ph{position:absolute;inset:0}
.gal .tape{position:absolute;left:1.4cqw;bottom:1.4cqw;max-width:88%;background:var(--ink);color:var(--paper);font-size:calc(2cqw*var(--bs,1));font-weight:700;line-height:1.3;padding:.7cqw 1.4cqw;transform:rotate(-1.2deg);z-index:3;box-shadow:.6cqw .6cqw 0 var(--orange)}
.gal.ga .item:nth-child(1){grid-column:1/-1;grid-row:span 2}
.gal.gb .item:nth-child(1){grid-column:1/5;grid-row:span 2}.gal.gb .item:nth-child(2),.gal.gb .item:nth-child(3){grid-column:5/7}
.gal.gc .item:nth-child(1){grid-column:1/4;grid-row:span 2}.gal.gc .item:nth-child(2),.gal.gc .item:nth-child(3){grid-column:4/7}.gal.gc .item:nth-child(4){grid-column:1/-1;grid-row:span 2}.gal.gc .item:nth-child(5){grid-column:1/-1}

/* ---------- join ---------- */
.join{background:var(--orange);color:var(--ink)}
.join .kicker{color:var(--ink)}
.join .h1{font-size:calc(11cqw*var(--hs,1))}
.join .rows{display:flex;flex-direction:column;margin-top:auto;border-top:.6cqw solid var(--ink)}
.join .row{display:grid;grid-template-columns:24cqw 1fr;gap:3cqw;padding:2cqw 0;border-bottom:.3cqw solid #11111440}
.join .k{font-family:var(--display);font-weight:900;font-size:calc(3cqw*var(--hs,1));text-transform:uppercase}
.join .v{font-size:calc(2.9cqw*var(--bs,1));font-weight:600;line-height:1.4;white-space:pre-line}
.join .foot{color:#111111aa}.join .foot .n{color:var(--ink)}
.join .ballbg{position:absolute;right:-22cqw;top:-18cqw;width:80cqw;height:80cqw;color:var(--ink);opacity:.12;z-index:1}

/* ---------- back ---------- */
.final{display:flex;align-items:center;justify-content:space-between;background:#050506;border:.6cqw solid #26262c;border-radius:2cqw;padding:3cqw 4cqw}
.final span{font-family:var(--display);font-weight:700;font-size:calc(2.6cqw*var(--hs,1));letter-spacing:.16em;color:var(--gold);text-transform:uppercase;white-space:pre-line}
.final b{font-family:var(--display);font-weight:900;font-size:calc(14cqw*var(--hs,1));color:var(--orange);text-shadow:0 0 2.4cqw #ff5a1f99;line-height:.9}
.back .rows{display:flex;flex-direction:column;gap:2cqw;margin-top:auto}
.back .row{display:grid;grid-template-columns:22cqw 1fr;gap:3cqw;border-top:.3cqw solid #ffffff26;padding-top:1.8cqw}
.back .k{font-size:calc(2.2cqw*var(--bs,1));font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--orange)}
.back .v{font-size:calc(3cqw*var(--bs,1));line-height:1.4;white-space:pre-line}
.back .h1{font-size:calc(10cqw*var(--hs,1))}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:560px){.top{gap:8px}.brand span{display:none}.btn{padding:6px 10px}}

/* ---------- sponsor tiers ---------- */
.tiers{display:flex;flex-direction:column;gap:3cqw;flex:1;min-height:0}
.tier{flex:1 1 auto;border-radius:3cqw;padding:3.6cqw 4cqw;display:flex;flex-direction:column;gap:1.4cqw;border:.5cqw solid var(--ink);background:var(--paper);position:relative;overflow:hidden}
.tier::after{content:"";position:absolute;right:-10cqw;bottom:-10cqw;width:30cqw;height:30cqw;border-radius:50%;border:.5cqw solid currentColor;opacity:.08;pointer-events:none}
.tr0{background:var(--ink);color:var(--paper);border-color:var(--orange)}
.tr0 .tt-price{color:var(--orange)}
.tr1{border-color:var(--gold);box-shadow:inset 0 1.4cqw 0 var(--gold)}
.tr2{border-color:var(--silver);box-shadow:inset 0 1.4cqw 0 var(--silver)}
.tr3{border-color:var(--bronze);box-shadow:inset 0 1.4cqw 0 var(--bronze)}
.tt-top{display:flex;justify-content:space-between;align-items:center;gap:2cqw}
.tt-name{font-family:var(--display);font-weight:900;font-size:calc(4.6cqw*var(--hs,1));text-transform:uppercase;letter-spacing:-.01em;margin:0;line-height:1.05}
.tt-tag{font-size:calc(1.9cqw*var(--bs,1));font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:.6cqw 1.6cqw;border-radius:99px;border:.3cqw solid currentColor;white-space:nowrap}
.tt-price{font-family:var(--display);font-weight:900;font-size:calc(5.4cqw*var(--hs,1));letter-spacing:-.02em;line-height:1}
.tt-perks{margin:0;padding:0;list-style:none;font-size:calc(2.45cqw*var(--bs,1));line-height:1.45;display:flex;flex-direction:column;gap:.7cqw;white-space:pre-line}
.tt-perks li{padding-left:3.6cqw;position:relative}
.tt-perks li::before{content:"";position:absolute;left:0;top:.75cqw;width:1.8cqw;height:1.8cqw;border-radius:50%;background:var(--orange);box-shadow:inset 0 0 0 .3cqw #111}

/* ---------- comparison matrix ---------- */
.mx-wrap{overflow:hidden}
.mx{width:100%;border-collapse:collapse;font-size:calc(2.3cqw*var(--bs,1));table-layout:fixed}
.mx th,.mx td{border-bottom:.2cqw solid var(--line);padding:1.8cqw 1cqw;vertical-align:middle}
.mx thead th{font-family:var(--display);font-weight:900;font-size:calc(2.3cqw*var(--hs,1));text-transform:uppercase;text-align:center;border-bottom:.5cqw solid var(--ink);width:13cqw}
.mx thead th:first-child{width:auto}
.mx .mx-c0{color:var(--orange)}.mx .mx-c1{color:#9a7414}.mx .mx-c2{color:#6f7682}.mx .mx-c3{color:var(--bronze)}
.mx tbody th{text-align:left;font-weight:700;line-height:1.3}
.mx td{text-align:center;font-size:calc(3.4cqw*var(--bs,1));line-height:1}
.mx td.on{color:var(--orange)}.mx td.half{color:var(--ink-2)}.mx td.off{color:var(--ink-2);opacity:.45}
.mx tr.item{position:relative}
.mx .xcell{width:0;padding:0;border:0}

/* ---------- jersey logo map ---------- */
.jsy{width:100%;height:auto;color:var(--ink);flex:none;display:block}
.spots{display:grid;grid-template-columns:1fr 1fr;gap:2.4cqw 3cqw}
.spots .item{display:grid;grid-template-columns:6cqw 1fr;gap:2cqw;align-items:start}
.sn{width:6cqw;height:6cqw;border-radius:50%;background:var(--orange);color:var(--ink);font-family:var(--display);font-weight:900;font-size:calc(3cqw*var(--hs,1));display:grid;place-items:center}
.spots .hd{font-family:var(--display);font-weight:700;font-size:calc(2.7cqw*var(--hs,1));text-transform:uppercase;margin-bottom:.4cqw;line-height:1.15}
.no-upper .tt-name,.no-upper .spots .hd{text-transform:none}

 document.getElementById('brandName').textContent=DATA.meta.brand;
 if(flip){try{flip.destroy()}catch(e){}flip=null}
 document.getElementById('btnMode').textContent=mode==='edit'?'Үзэх':'Засах';
 document.getElementById('btnSave').hidden=mode!=='edit'&&!isDirty();
 updateStatus();
 if(mode==='edit')renderEditor();else renderBook();
}

function renderBook(){
 var n=DATA.pages.length;
 main.innerHTML='<div class="stage"><div id="book">'+DATA.pages.map(pageHTML).join('')+'</div></div>'+
  '<div class="nav"><button class="arrow" id="prev" aria-label="Өмнөх">‹</button><input type="range" id="slider" min="0" max="'+(n-1)+'" value="'+cur+'" aria-label="Хуудас"><span class="count" id="count"></span><button class="arrow" id="next" aria-label="Дараах">›</button></div>';
 var book=document.getElementById('book');
 if(window.St&&St.PageFlip){
  var sw=Math.min(window.innerWidth-32,1100),sh=window.innerHeight-170;
  var pw=Math.max(260,Math.min(520,sw/2,sh/1.414));
  book.style.width=Math.round(pw)+'px';fitAll(book);book.style.width='';
  flip=new St.PageFlip(book,{width:Math.round(pw),height:Math.round(pw*1.414),size:'fixed',showCover:true,maxShadowOpacity:.45,mobileScrollSupport:true,usePortrait:true,flippingTime:800});
  flip.loadFromHTML(book.querySelectorAll('.page'));
  try{if(cur)flip.turnToPage(cur)}catch(e){}
  flip.on('flip',function(e){cur=e.data;syncNav()});
  flip.on('changeOrientation',syncNav);
 }else{
  book.className='simple';renderSimple();
 }
 document.getElementById('prev').onclick=function(){go(-1)};
 document.getElementById('next').onclick=function(){go(1)};
 document.getElementById('slider').oninput=function(e){var v=+e.target.value;if(flip)flip.flip(v);else{cur=v;renderSimple()}};
 syncNav();
}
function spreadOf(i){var n=DATA.pages.length;if(i===0)return [0];if(window.innerWidth<760)return [i];var a=i%2?i:i-1;return a+1<n?[a,a+1]:[a]}
function renderSimple(){var book=document.getElementById('book');book.innerHTML=spreadOf(cur).map(function(i){return pageHTML(DATA.pages[i],i)}).join('');fitAll(book);syncNav()}
function go(dir){if(flip){dir>0?flip.flipNext():flip.flipPrev();return}var s=spreadOf(cur);cur=Math.max(0,Math.min(DATA.pages.length-1,dir>0?s[s.length-1]+1:s[0]-1));renderSimple()}
function syncNav(){var n=DATA.pages.length,c=document.getElementById('count'),sl=document.getElementById('slider');if(!c)return;
 var s;if(flip){var i=flip.getCurrentPageIndex();cur=i;var orient=flip.getOrientation&&flip.getOrientation();s=(orient==='portrait'||i===0)?[i]:(i%2?[i,i+1]:[i-1,i]);s=s.filter(function(x){return x>=0&&x<n})}else s=spreadOf(cur);
 c.textContent=s.map(function(x){return x+1}).join('–')+' / '+n;sl.value=cur}
document.addEventListener('keydown',function(e){if(mode!=='view'||e.target.closest('input,[contenteditable]'))return;if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});
var rsT;window.addEventListener('resize',function(){if(mode!=='view')return;clearTimeout(rsT);rsT=setTimeout(render,250)});

function renderEditor(){
 var h='<div class="editor editing">'+fontPanel()+'<p class="help"><b>Засах горим.</b> Текст дээр дарж шууд бичнэ. Зурган дээр дарж өөрийн зургаа оруулна. Хуудсыг зөөх, устгах, шинээр нэмэх боломжтой. Дуусаад <b>Хадгалах</b> дарна уу.</p>';
 DATA.pages.forEach(function(d,i){
  var fixed=i===0||i===DATA.pages.length-1;
  h+='<div class="ed-page">'+pageHTML(d,i)+'<div class="ed-tools"><div class="num">'+(i+1)+'</div><div class="kind">'+esc(KIND[d.type]||d.type)+'</div>'+
   (fixed?'':'<button class="btn sm" data-move="'+i+':-1"'+(i<=1?' disabled':'')+'>↑ Дээш</button><button class="btn sm" data-move="'+i+':1"'+(i>=DATA.pages.length-2?' disabled':'')+'>↓ Доош</button><button class="btn sm" data-dup="'+i+'">Хуулбарлах</button><button class="btn sm danger" data-delpage="'+i+'">Хуудас устгах</button>')+'</div></div>';
  if(i<DATA.pages.length-1)h+='<div class="add-row"><span class="lbl">Энд хуудас нэмэх:</span>'+Object.keys(TEMPLATES).map(function(k){return '<button class="btn sm" data-newpage="'+(i+1)+':'+k+'">+ '+KIND[k]+'</button>'}).join('')+'</div>';
 });
 main.innerHTML=h+'</div>';fitAll(main);
}

/* ---------- editing events ---------- */
var draftT;
function touched(){updateStatus();document.getElementById('btnSave').hidden=false;clearTimeout(draftT);draftT=setTimeout(function(){try{localStorage.setItem(DRAFT_KEY,JSON.stringify({base:savedJson,data:DATA}))}catch(e){}},600)}
main.addEventListener('change',onFontInput);main.addEventListener('input',function(e){onFontInput(e);var el=e.target.closest('[data-f]');if(!el)return;set(el.dataset.f,el.innerText.replace(/\n$/,''));touched();var pgEl=el.closest('.page');clearTimeout(fitT);fitT=setTimeout(function(){if(pgEl.isConnected)fitPage(pgEl)},350)});var fitT;
main.addEventListener('paste',function(e){var el=e.target.closest('[data-f]');if(!el)return;e.preventDefault();var t=(e.clipboardData||window.clipboardData).getData('text/plain');document.execCommand('insertText',false,t)});
var imgTarget=null,fileIn=document.getElementById('fileIn');
main.addEventListener('click',function(e){
 if(mode!=='edit')return;
 var b;if(e.target.id==='fReset'){delete DATA.meta.font;applyFonts();touched();keepScroll(renderEditor);return}
 if((b=e.target.closest('[data-del]'))){var ps=b.dataset.del.split('.'),idx=+ps.pop(),arr=get(ps.join('.'));if(arr.length>1){arr.splice(idx,1);touched();keepScroll(renderEditor)}else toast('Сүүлийн мөрийг устгах боломжгүй');return}
 if((b=e.target.closest('[data-add]'))){var path=b.dataset.add,pi=+path.split('.')[0],key=path.split('.').pop();get(path).push(ITEM_NEW[key](DATA.pages[pi]));touched();keepScroll(renderEditor);return}
 if((b=e.target.closest('[data-move]'))){var mv=b.dataset.move.split(':'),i=+mv[0],j=i+(+mv[1]);var t=DATA.pages[i];DATA.pages[i]=DATA.pages[j];DATA.pages[j]=t;touched();keepScroll(renderEditor);return}
 if((b=e.target.closest('[data-dup]'))){var k=+b.dataset.dup;DATA.pages.splice(k+1,0,JSON.parse(JSON.stringify(DATA.pages[k])));touched();keepScroll(renderEditor);return}
 if((b=e.target.closest('[data-delpage]'))){var k2=+b.dataset.delpage;if(b.dataset.armed){DATA.pages.splice(k2,1);touched();keepScroll(renderEditor)}else{b.dataset.armed='1';b.textContent='Дахин дарж баталгаажуулна уу';setTimeout(function(){if(b.isConnected){delete b.dataset.armed;b.textContent='Хуудас устгах'}},3000)}return}
 if((b=e.target.closest('[data-newpage]'))){var np=b.dataset.newpage.split(':');DATA.pages.splice(+np[0],0,TEMPLATES[np[1]]());touched();keepScroll(renderEditor);return}
 if((b=e.target.closest('[data-img]'))){imgTarget=b.dataset.img;fileIn.value='';fileIn.click()}
});
main.addEventListener('click',function(e){if(mode!=='view')return;var a=e.target.closest('[data-goto]');if(!a)return;e.preventDefault();e.stopPropagation();var n=+a.dataset.goto;if(flip)flip.flip(n);else{cur=n;renderSimple()}},true);
main.addEventListener('keydown',function(e){var f=e.target.closest&&e.target.closest('[data-img]');if(mode==='edit'&&f&&(e.key==='Enter'||e.key===' ')){e.preventDefault();f.click()}});
function keepScroll(fn){var y=window.scrollY;fn();window.scrollTo(0,y)}
fileIn.addEventListener('change',function(){var f=fileIn.files&&fileIn.files[0];if(!f||!imgTarget)return;var target=imgTarget;
 compress(f).then(function(url){set(target,url);touched();var fig=main.querySelector('[data-img="'+target+'"]');if(fig)fig.innerHTML='<img alt="" src="'+url+'">';var kb=Math.round(url.length*0.75/1024);toast('Зураг орлоо ('+kb+' KB)')}).catch(function(){toast('Зургийг уншиж чадсангүй. JPG эсвэл PNG файл сонгоно уу.')})});
function compress(file){return new Promise(function(res,rej){var r=new FileReader();r.onerror=rej;r.onload=function(){var im=new Image();im.onerror=rej;im.onload=function(){var max=1200,s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.72))};im.src=r.result};r.readAsDataURL(file)})}

/* ---------- save ---------- */
function buildDoc(){
 var json=JSON.stringify(DATA).replace(/</g,'\\u003c');
 return '<!doctype html>\n<html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>'+esc(document.title||'52-р сургууль')+'</title>'+fontLinks()+
  '<style id="book-style">'+document.getElementById('book-style').textContent+'</style></head><body>'+
  '<script type="application/json" id="book-data">'+json+'<\/script><script src="'+FLIP_SRC+'"><\/script>'+
  '<script id="book-script">'+document.getElementById('book-script').textContent+'<\/script></body></html>';
}
document.getElementById('btnSave').onclick=function(){
 var btn=this;if(!artifactApi){toast(artifactApi===null&&window.claude&&claude.use?'Хадгалах эрх ачаалагдаж байна. Хэдэн секундын дараа дахин дарна уу.':'Энэ хуудсыг claude.ai дээр нээж байж хадгална. Одоохондоо “Файлаар татах”-ыг ашиглана уу.');return}
 var html=buildDoc();if(html.length>15.5e6){toast('Хэт том байна ('+(html.length/1e6).toFixed(1)+' MB). Зарим зургийг устгана уу.');return}
 btn.disabled=true;btn.textContent='Хадгалж байна…';
 try{localStorage.setItem(DRAFT_KEY,JSON.stringify({base:savedJson,data:DATA}))}catch(e){}
 artifactApi.publish(html).then(function(){toast('Хадгалагдлаа')}).catch(function(err){
  var c=err&&err.code;btn.textContent='Хадгалах';
  if(c==='not_writer'||c==='not_granted'||c==='consent_required'||c==='capability_disabled'||c==='capability_removed'||c==='not_declared'){readOnly=true;updateStatus();toast('Танд энэ номыг засах эрх алга. Засвар энэ төхөөрөмж дээр түр хадгалагдсан.')}
  else if(c==='conflict'){toast('Өөр хүн түрүүлж хадгалсан байна. Шинэ хувилбар ачаалагдаж байна — таны засвар “Сэргээх” товчоор буцаж ирнэ.')}
  else if(c==='too_large'){btn.disabled=false;toast('Хэт том байна. Зарим зургийг устгаад дахин оролдоно уу.')}
  else if(c==='rate_limited'){btn.disabled=false;toast('Хэт ойр ойрхон хадгаллаа. Хэсэг хүлээгээд дахин дарна уу.')}
  else{btn.disabled=false;toast('Хадгалж чадсангүй. Дахин оролдоно уу.')}
 });
};
var DL_NAME='52-sponsor-bagts.html';
document.getElementById('btnDl').onclick=function(){var btn=this;
 if(!downloadsApi){toast(downloadsApi===null&&window.claude&&claude.use?'Татах эрх ачаалагдаж байна. Хэдэн секундын дараа дахин дарна уу.':'Энэ харагдацад файл татах боломжгүй. Номыг claude.ai дээр нээж татна уу.');return}
 btn.disabled=true;var data;try{data=new Blob([buildDoc()],{type:'text/html'})}catch(e){data=buildDoc()}
 downloadsApi.save({filename:DL_NAME,data:data}).then(function(r){if(!r||r.status!=='delivered')toast('Файл татагдлаа: '+DL_NAME)}).catch(function(e){var c=e&&e.code;
  if(c==='declined')return;
  if(c==='rate_limited')toast('Татах цонх аль хэдийн нээлттэй байна. Түүнийг хаагаад дахин дарна уу.');
  else if(c==='too_large')toast('Файл хэт том байна. Зарим зургийг устгаад дахин оролдоно уу.');
  else if(c==='unavailable'||c==='not_granted'||c==='capability_disabled'||c==='capability_removed'||c==='extension_not_enabled'){downloadsApi=false;toast('Энэ харагдацад файл татах боломжгүй байна.')}
  else toast('Файл татаж чадсангүй. Дахин оролдоно уу.')}).then(function(){btn.disabled=false})};
document.getElementById('btnMode').onclick=function(){if(mode==='edit'){mode='view';var n=DATA.pages.length;if(cur>=n)cur=n-1}else{mode='edit'}window.scrollTo(0,0);render()};

/* ---------- draft restore ---------- */
(function(){var raw=null;try{raw=localStorage.getItem(DRAFT_KEY)}catch(e){}if(!raw)return;var d;try{d=JSON.parse(raw)}catch(e){return}
 var dj=JSON.stringify(d.data);if(dj===savedJson){try{localStorage.removeItem(DRAFT_KEY)}catch(e){}return}
 var ban=document.getElementById('draftBanner');ban.hidden=false;
 document.getElementById('draftRestore').onclick=function(){DATA=d.data;ban.hidden=true;mode='edit';render();touched()};
 document.getElementById('draftDrop').onclick=function(){try{localStorage.removeItem(DRAFT_KEY)}catch(e){}ban.hidden=true};
})();

applyFonts();render();

/* ---------- capabilities ---------- */
if(window.claude&&claude.use){
 claude.use('artifact').then(function(a){artifactApi=a||false}).catch(function(){artifactApi=false});
 claude.use('downloads').then(function(d){downloadsApi=d||false}).catch(function(){downloadsApi=false});
}
})();
</script>
